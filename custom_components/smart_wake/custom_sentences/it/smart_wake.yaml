language: "it"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "imposta la sveglia [in] {alarm} alle {time}"
          - "imposta la sveglia alle {time}"
          - "metti la sveglia [in] {alarm} alle {time}"
          - "metti la sveglia alle {time}"
          - "svegliami domani alle {time}"
          - "svegliami alle {time}"
          - "cambia la sveglia [in] {alarm} alle {time}"
          - "cambia la sveglia alle {time}"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "attiva la sveglia [in] {alarm}"
          - "attiva la sveglia"
          - "accendi la sveglia [in] {alarm}"
          - "accendi la sveglia"
        slots:
          status: "on"
      - sentences:
          - "disattiva la sveglia [in] {alarm}"
          - "disattiva la sveglia"
          - "spegni la sveglia [in] {alarm}"
          - "spegni la sveglia"
          - "spegni la sveglia per domani"
        slots:
          status: "off"

  SmartWakeSnooze:
    data:
      - sentences:
          - "posponi la sveglia"
          - "posponi"
          - "fammi dormire ancora {duration} minuti"
          - "fammi dormire ancora cinque minuti"
          - "fammi dormire ancora dieci minuti"
          - "snooze"

  SmartWakeDismiss:
    data:
      - sentences:
          - "sono sveglio"
          - "mi sono alzato"
          - "ferma la sveglia [in] {alarm}"
          - "ferma la sveglia"
          - "spegni la sveglia"
          - "stop"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
