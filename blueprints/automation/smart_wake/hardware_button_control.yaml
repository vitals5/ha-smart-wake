blueprint:
  name: "Smart Wake - Hardware Taster Steuerung (Snooze & Dismiss)"
  description: "Steuert Schlummern (Einfachklick) und Quittieren (Doppelklick) eines Smart Wake Weckers über einen Zigbee/Z-Wave Hardware-Taster."
  domain: automation
  input:
    alarm_entity:
      name: Smart Wake Wecker
      description: Der zu steuernde Smart Wake Wecker Status-Sensor.
      selector:
        entity:
          domain: sensor
          integration: smart_wake
    button_entity:
      name: Hardware Taster Entity (Event oder Sensor)
      description: Der Taster oder Handsender am Nachttisch.
      selector:
        entity:
    single_click_action:
      name: Einfachklick Ereignis / Wert
      description: Wert für Einfachklick (z. B. 'single', '1', 'on').
      default: "single"
      selector:
        text:
    double_click_action:
      name: Doppelklick Ereignis / Wert
      description: Wert für Doppelklick (z. B. 'double', '2').
      default: "double"
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input button_entity

condition:
  - condition: state
    entity_id: !input alarm_entity
    state:
      - "ringing"
      - "pre_alarm"
      - "snoozed"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.to_state.state == single_click_action or
                 trigger.to_state.attributes.event_type == single_click_action or
                 trigger.to_state.attributes.action == single_click_action }}
        sequence:
          - service: smart_wake.snooze
            data:
              alarm_id: !input alarm_entity
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.to_state.state == double_click_action or
                 trigger.to_state.attributes.event_type == double_click_action or
                 trigger.to_state.attributes.action == double_click_action }}
        sequence:
          - service: smart_wake.dismiss
            data:
              alarm_id: !input alarm_entity
mode: single
