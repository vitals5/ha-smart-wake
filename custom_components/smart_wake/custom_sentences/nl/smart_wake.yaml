language: "nl"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "zet de wekker [in] {alarm} op {time} [uur]"
          - "zet de wekker op {time} [uur]"
          - "stel de wekker [in] {alarm} in op {time} [uur]"
          - "stel de wekker in op {time} [uur]"
          - "maak me morgen wakker om {time} [uur]"
          - "maak me wakker om {time} [uur]"
          - "verander de wekker [in] {alarm} naar {time} [uur]"
          - "verander de wekker naar {time} [uur]"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "schakel de wekker [in] {alarm} in"
          - "schakel de wekker in"
          - "zet de wekker [in] {alarm} aan"
          - "zet de wekker aan"
        slots:
          status: "on"
      - sentences:
          - "schakel de wekker [in] {alarm} uit"
          - "schakel de wekker uit"
          - "zet de wekker [in] {alarm} uit"
          - "zet de wekker uit"
          - "zet de wekker voor morgen uit"
        slots:
          status: "off"

  SmartWakeSnooze:
    data:
      - sentences:
          - "snooze de wekker"
          - "snooze"
          - "nog {duration} minuten slapen"
          - "nog vijf minuten slapen"
          - "nog tien minuten slapen"
          - "nog even doorslapen"

  SmartWakeDismiss:
    data:
      - sentences:
          - "ik ben wakker"
          - "ik ben opgestaan"
          - "stop de wekker [in] {alarm}"
          - "stop de wekker"
          - "wekker uit"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
