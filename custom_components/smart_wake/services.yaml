snooze:
  name: Wecker schlummern (Snooze)
  description: Schlummert einen aktiven Wecker für die konfigurierte Dauer oder eine benutzerdefinierte Minutenzahl.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Name oder Config Entry ID des Weckers. Wenn leer, wird der aktuell klingelnde Wecker geschlummert.
      example: "Wecker Schlafzimmer"
      selector:
        text:
    duration:
      name: Schlummerdauer (Minuten)
      description: Optionale Schlummerdauer in Minuten. Wenn nicht angegeben, wird der Standardwert verwendet.
      example: 9
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

dismiss:
  name: Wecker quittieren (Dismiss)
  description: Quittiert und beendet einen aktiven Wecker oder Vor-Alarm.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Name oder Config Entry ID des Weckers. Wenn leer, werden alle aktiven Wecker beendet.
      example: "Wecker Schlafzimmer"
      selector:
        text:

test_alarm:
  name: Testlauf starten
  description: Startet einen 30-sekündigen Zeitraffer-Testlauf oder einen vollen Echtzeit-Testlauf zur Überprüfung aller Phasen.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Der zu testende Wecker.
      example: "Wecker Schlafzimmer"
      selector:
        text:
    mode:
      name: Modus
      description: "dry_run für 30s Zeitraffer, full für vollen Echtzeit-Durchlauf."
      default: "dry_run"
      selector:
        select:
          options:
            - label: "30s Zeitraffer"
              value: "dry_run"
            - label: "Voller Testlauf"
              value: "full"
    start_from_pre_alarm:
      name: Ab Pre-Alarm starten
      description: Ob der Test ab Phase 1 (Pre-Alarm) oder direkt bei Phase 2 (Hauptalarm) starten soll.
      default: true
      selector:
        boolean:

start_full_test:
  name: Vollen Testlauf starten
  description: Startet den echten Weckablauf sofort in Echtzeit mit Live-Aktionen, TTS-Begrüßung und Anti-Cheat Quittierung.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Der zu testende Wecker.
      example: "Wecker Schlafzimmer"
      selector:
        text:
    start_from_pre_alarm:
      name: Ab Pre-Alarm starten
      description: Ob der Test ab Phase 1 (Pre-Alarm) oder direkt bei Phase 2 (Hauptalarm) beginnen soll.
      default: true
      selector:
        boolean:

stop_test:
  name: Testlauf stoppen
  description: Bricht einen laufenden 30-Sekunden-Zeitraffer oder vollen Testlauf vorzeitig ab.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Der Wecker, dessen Test gestoppt werden soll.
      example: "Wecker Schlafzimmer"
      selector:
        text:

skip_next:
  name: Nächsten Alarm überspringen
  description: Überspringt einmalig den nächsten regulären Wecklauf, ohne den Wecker dauerhaft auszuschalten.
  fields:
    alarm_id:
      name: Wecker ID oder Name
      description: Der Wecker, dessen nächster Lauf übersprungen werden soll.
      selector:
        text:
    skip:
      name: Überspringen aktivieren
      description: True um zu überspringen, False um die Überspringung aufzuheben.
      default: true
      selector:
        boolean:

set_time:
  name: Weckzeit einstellen
  description: Setzt eine neue Weckzeit für einen Smart Wake Wecker.
  fields:
    time:
      name: Weckzeit (HH:MM)
      description: Die neue Weckzeit im Format HH:MM.
      required: true
      example: "06:45"
      selector:
        time:
    alarm_id:
      name: Wecker ID oder Name
      description: Zielwecker für die Zeiteinstellung.
      example: "Wecker Schlafzimmer"
      selector:
        text:
