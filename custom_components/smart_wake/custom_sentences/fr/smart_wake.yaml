language: "fr"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "règle le réveil [dans] [la] {alarm} à {time} [heures|h]"
          - "règle le réveil à {time} [heures|h]"
          - "mets le réveil [dans] [la] {alarm} à {time} [heures|h]"
          - "mets le réveil à {time} [heures|h]"
          - "réveille-moi demain à {time} [heures|h]"
          - "réveille-moi à {time} [heures|h]"
          - "change [l'heure] [du] réveil [dans] [la] {alarm} à {time} [heures|h]"
          - "change le réveil à {time} [heures|h]"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "active le réveil [dans] [la] {alarm}"
          - "active le réveil"
          - "allume le réveil [dans] [la] {alarm}"
          - "allume le réveil"
        slots:
          status: "on"
      - sentences:
          - "désactive le réveil [dans] [la] {alarm}"
          - "désactive le réveil"
          - "éteins le réveil [dans] [la] {alarm}"
          - "éteins le réveil"
          - "éteins le réveil pour demain"
        slots:
          status: "off"

  SmartWakeSnooze:
    data:
      - sentences:
          - "répète le réveil"
          - "répéter le réveil"
          - "laisse-moi dormir encore {duration} minutes"
          - "laisse-moi dormir encore cinq minutes"
          - "laisse-moi dormir encore dix minutes"
          - "encore un peu de sommeil"
          - "snooze"

  SmartWakeDismiss:
    data:
      - sentences:
          - "je suis réveillé"
          - "je suis debout"
          - "arrête le réveil [dans] [la] {alarm}"
          - "arrête le réveil"
          - "stop le réveil"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
