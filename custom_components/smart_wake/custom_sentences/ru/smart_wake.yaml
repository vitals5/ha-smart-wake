language: "ru"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "поставь [будильник] [в] {alarm} на {time} [часов|часа|час]"
          - "поставь будильник на {time} [часов|часа|час]"
          - "разбуди меня завтра в {time} [часов|часа|час]"
          - "разбуди меня в {time} [часов|часа|час]"
          - "измени [время] [будильника] [в] {alarm} на {time} [часов|часа|час]"
          - "измени [время] будильника на {time} [часов|часа|час]"
          - "установи будильник [в] {alarm} на {time} [часов|часа|час]"
          - "установи будильник на {time} [часов|часа|час]"
          - "переставь будильник [в] {alarm} на {time} [часов|часа|час]"
          - "переставь будильник на {time} [часов|часа|час]"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "включи [будильник] [в] {alarm}"
          - "включи будильник"
          - "активируй [будильник] [в] {alarm}"
          - "активируй будильник"
          - "заведи будильник [в] {alarm}"
          - "заведи будильник"
        slots:
          status: "ein"
      - sentences:
          - "выключи [будильник] [в] {alarm}"
          - "выключи будильник"
          - "отключи [будильник] [в] {alarm}"
          - "отключи будильник"
          - "деактивируй [будильник] [в] {alarm}"
          - "деактивируй будильник"
          - "выключи будильник на завтра"
        slots:
          status: "aus"

  SmartWakeSnooze:
    data:
      - sentences:
          - "дай поспать ещё {duration} минут[ы]"
          - "дай поспать ещё пять минут"
          - "дай поспать ещё десять минут"
          - "дай поспать ещё чуть-чуть"
          - "отложи будильник [в] {alarm}"
          - "отложи будильник"
          - "дремать"
          - "снуз"

  SmartWakeDismiss:
    data:
      - sentences:
          - "я проснулся"
          - "я встал"
          - "останови будильник [в] {alarm}"
          - "останови будильник"
          - "выключи звонок"
          - "хватит звонить"
          - "заглуши будильник"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
