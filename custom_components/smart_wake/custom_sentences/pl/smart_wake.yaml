language: "pl"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "ustaw budzik [w] {alarm} na {time}"
          - "ustaw budzik na {time}"
          - "obudź mnie jutro o {time}"
          - "obudź mnie o {time}"
          - "zmień budzik [w] {alarm} na {time}"
          - "zmień budzik na {time}"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "włącz budzik [w] {alarm}"
          - "włącz budzik"
          - "aktywuj budzik [w] {alarm}"
          - "aktywuj budzik"
        slots:
          status: "on"
      - sentences:
          - "wyłącz budzik [w] {alarm}"
          - "wyłącz budzik"
          - "deaktywuj budzik [w] {alarm}"
          - "deaktywuj budzik"
          - "wyłącz budzik na jutro"
        slots:
          status: "off"

  SmartWakeSnooze:
    data:
      - sentences:
          - "odłóż budzik"
          - "drzemka"
          - "daj mi pospać jeszcze {duration} minut"
          - "daj mi pospać jeszcze pięć minut"
          - "daj mi pospać jeszcze dziesięć minut"
          - "snooze"

  SmartWakeDismiss:
    data:
      - sentences:
          - "już nie śpię"
          - "wstałem"
          - "zatrzymaj budzik [w] {alarm}"
          - "zatrzymaj budzik"
          - "wyłącz budzik"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
