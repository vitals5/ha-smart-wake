language: "de"
intents:
  SmartWakeSetTime:
    data:
      - sentences:
          - "stelle [den] [wecker] {alarm} auf {time} [uhr]"
          - "stelle [den] wecker auf {time} [uhr]"
          - "wecke mich morgen um {time} [uhr]"
          - "wecke mich um {time} [uhr]"
          - "ändere [den] [wecker] {alarm} auf {time} [uhr]"
          - "ändere [den] wecker auf {time} [uhr]"
          - "weckzeit [für] [wecker] {alarm} auf {time} [uhr] [setzen|stellen]"

  SmartWakeSetStatus:
    data:
      - sentences:
          - "schalte [den] [wecker] {alarm} [wieder] (an|ein)"
          - "schalte [den] wecker [wieder] (an|ein)"
          - "aktiviere [den] [wecker] {alarm}"
          - "aktiviere [den] wecker"
          - "[wecker] {alarm} (an|ein)[schalten]"
          - "wecker (an|ein)[schalten]"
        slots:
          status: "ein"
      - sentences:
          - "schalte [den] [wecker] {alarm} aus"
          - "schalte [den] wecker aus"
          - "deaktiviere [den] [wecker] {alarm}"
          - "deaktiviere [den] wecker"
          - "[wecker] {alarm} aus[schalten]"
          - "wecker aus[schalten]"
          - "schalte den wecker für morgen aus"
        slots:
          status: "aus"

  SmartWakeSnooze:
    data:
      - sentences:
          - "{duration} minuten weiterschlafen"
          - "fünf minuten weiterschlafen"
          - "zehn minuten weiterschlafen"
          - "noch ein bisschen weiterschlafen"
          - "[wecker] {alarm} schlummern"
          - "wecker schlummern"
          - "schlummern"
          - "snooze"

  SmartWakeDismiss:
    data:
      - sentences:
          - "ich bin wach"
          - "wecker stoppen"
          - "wecker {alarm} stoppen"
          - "alarm stoppen"
          - "wecker quittieren"
          - "wecker {alarm} quittieren"
          - "alarm beenden"

lists:
  alarm:
    wildcard: true
  time:
    wildcard: true
  duration:
    range:
      from: 1
      to: 60
