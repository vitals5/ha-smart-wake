blueprint:
  name: "Smart Wake - Anti-Cheat Quittierung via Bewegung oder Kaffeemaschine"
  description: "Quittiert automatisch einen klingelnden Smart Wake Wecker, sobald Bewegung im Bad/Küche erkannt wird oder die Kaffeemaschine eingeschaltet wird (Aufsteh-Beweis)."
  domain: automation
  input:
    alarm_entity:
      name: Smart Wake Wecker Status Sensor
      description: Der Status-Sensor des zu überwachenden Smart Wake Weckers.
      selector:
        entity:
          domain: sensor
          integration: smart_wake
    motion_sensor:
      name: Präsenz- / Bewegungsmelder
      description: Bewegungsmelder im Badezimmer oder Küche.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    power_sensor:
      name: Kaffeemaschine Leistungssensor (optional)
      description: Leistungssensor der Kaffeemaschine.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: power
    power_threshold:
      name: Leistungsschwelle (Watt)
      description: Ab welcher Leistung gilt die Kaffeemaschine als aktiv.
      default: 15
      selector:
        number:
          min: 1
          max: 2000
          unit_of_measurement: W

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_trigger
  - platform: numeric_state
    entity_id: !input power_sensor
    above: !input power_threshold
    id: power_trigger

condition:
  - condition: state
    entity_id: !input alarm_entity
    state:
      - "ringing"
      - "pre_alarm"
      - "snoozed"

action:
  - service: smart_wake.dismiss
    data:
      alarm_id: !input alarm_entity
  - service: system_log.write
    data:
      message: "Smart Wake Wecker erfolgreich via Anti-Cheat quittiert (Aufstehen bestätigt)."
      level: info
mode: single
