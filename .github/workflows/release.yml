name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build & Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip custom_components
        run: |
          cd custom_components/smart_wake
          zip smart_wake.zip -r ./
          mv smart_wake.zip ../../

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: smart_wake.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
